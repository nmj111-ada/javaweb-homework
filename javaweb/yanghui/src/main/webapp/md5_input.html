<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MD5 散列值计算</title>
</head>
<body>
    <h2>计算文本的 MD5 散列值</h2>
    <form action="md5" method="post">
        <label>请输入一段文字：</label><br>
        <textarea name="text" rows="5" cols="40" required></textarea><br><br>
        <button type="submit">提交</button>
    </form>
</body>
</html>
